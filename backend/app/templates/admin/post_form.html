{% extends "base.html" %}

{% block title %}{% if post %}Edit{% else %}New{% endif %} Post - SRE Blog{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-heading font-black text-synthwave-magenta glow-text">
            {% if post %}Edit{% else %}New{% endif %} Post
        </h1>
        <a href="/admin" class="text-synthwave-cyan hover:text-synthwave-magenta">← Back to Dashboard</a>
    </div>
    
    <form method="post" class="space-y-6">
        <div>
            <label class="block text-gray-400 text-sm mb-2">Title</label>
            <input type="text" name="title" value="{{ post.title if post else '' }}" class="w-full px-4 py-3 rounded" required>
        </div>
        
        <div>
            <label class="block text-gray-400 text-sm mb-2">Slug</label>
            <input type="text" name="slug" value="{{ post.slug if post else '' }}" class="w-full px-4 py-3 rounded" required>
        </div>
        
        <div>
            <label class="block text-gray-400 text-sm mb-2">Content (Markdown)</label>
            <textarea name="content" id="markdown-editor" class="w-full px-4 py-3 rounded font-mono text-sm" rows="20" required>{{ post.content if post else '' }}</textarea>
            <div class="mt-2 flex gap-2">
                <button type="button" onclick="insertMarkdown('**', '**')" class="px-3 py-1 bg-synthwave-card border border-synthwave-border rounded text-sm hover:border-synthwave-magenta">Bold</button>
                <button type="button" onclick="insertMarkdown('*', '*')" class="px-3 py-1 bg-synthwave-card border border-synthwave-border rounded text-sm hover:border-synthwave-magenta">Italic</button>
                <button type="button" onclick="insertMarkdown('`', '`')" class="px-3 py-1 bg-synthwave-card border border-synthwave-border rounded text-sm hover:border-synthwave-magenta">Code</button>
                <button type="button" onclick="insertMarkdown('\n```\n', '\n```\n')" class="px-3 py-1 bg-synthwave-card border border-synthwave-border rounded text-sm hover:border-synthwave-magenta">Code Block</button>
                <button type="button" onclick="insertMarkdown('[', '](url)')" class="px-3 py-1 bg-synthwave-card border border-synthwave-border rounded text-sm hover:border-synthwave-magenta">Link</button>
                <button type="button" onclick="insertMarkdown('\n## ', '\n')" class="px-3 py-1 bg-synthwave-card border border-synthwave-border rounded text-sm hover:border-synthwave-magenta">Heading</button>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <input type="checkbox" name="published" id="published" {% if post and post.published %}checked{% endif %} class="w-5 h-5">
            <label for="published" class="text-gray-300">Publish immediately</label>
        </div>
        
        <div class="flex gap-4">
            <button type="submit" class="btn-neon">
                {% if post %}Update{% else %}Create{% endif %} Post
            </button>
            <a href="/admin" class="btn-neon bg-gray-700 hover:bg-gray-600">Cancel</a>
        </div>
    </form>
</div>

{% block scripts %}
<script>
function insertMarkdown(before, after) {
    const textarea = document.getElementById('markdown-editor');
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const text = textarea.value;
    const selected = text.substring(start, end);
    
    textarea.value = text.substring(0, start) + before + selected + after + text.substring(end);
    textarea.focus();
    textarea.selectionStart = start + before.length;
    textarea.selectionEnd = start + before.length + selected.length;
}
</script>
{% endblock %}
{% endblock %}
